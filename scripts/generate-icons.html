<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>Click each button to download the icon</h2>
<div id="previews"></div>
<script>
const sizes = [16, 32, 180, 192, 512];
const container = document.getElementById('previews');

function drawIcon(ctx, size) {
  const s = size / 64;
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#6366f1');
  grad.addColorStop(1, '#818cf8');

  // Rounded rect
  const r = 14 * s;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Bars
  const bars = [
    { x: 12, y: 36, w: 8, h: 16, a: 0.9 },
    { x: 24, y: 24, w: 8, h: 28, a: 1.0 },
    { x: 36, y: 30, w: 8, h: 22, a: 0.9 },
    { x: 48, y: 18, w: 8, h: 34, a: 0.75 },
  ];
  bars.forEach(b => {
    ctx.globalAlpha = b.a;
    ctx.fillStyle = '#ffffff';
    const br = 2 * s;
    const x = b.x * s, y = b.y * s, w = b.w * s, h = b.h * s;
    ctx.beginPath();
    ctx.moveTo(x + br, y);
    ctx.lineTo(x + w - br, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + br);
    ctx.lineTo(x + w, y + h - br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    ctx.lineTo(x + br, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - br);
    ctx.lineTo(x, y + br);
    ctx.quadraticCurveTo(x, y, x + br, y);
    ctx.closePath();
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // CSV text (only for larger sizes)
  if (size >= 64) {
    ctx.fillStyle = '#c7d2fe';
    ctx.font = `700 ${8 * s}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('CSV', 32 * s, 14 * s);
  }
}

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size);

  const name = size === 180 ? 'apple-touch-icon.png' : `favicon-${size}x${size}.png`;
  const btn = document.createElement('button');
  btn.textContent = `Download ${name} (${size}x${size})`;
  btn.style.cssText = 'display:block;margin:8px 0;padding:8px 16px;font-size:14px;cursor:pointer;';
  btn.onclick = () => {
    const a = document.createElement('a');
    a.download = name;
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  const div = document.createElement('div');
  div.style.cssText = 'display:flex;align-items:center;gap:12px;margin:12px 0;';
  canvas.style.cssText = `border:1px solid #ddd;width:${Math.min(size,64)}px;height:${Math.min(size,64)}px;`;
  div.appendChild(canvas);
  div.appendChild(btn);
  container.appendChild(div);
});

// Also provide a favicon.ico download (32x32 as PNG, browsers accept it)
</script>
</body>
</html>
